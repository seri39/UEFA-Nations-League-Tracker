function updateFavoriteHighlights(){for(const team of document.querySelectorAll('#matches [data-team]')){const active=favs.has(team.dataset.team),cn=team.querySelector('.team-cn');team.classList.toggle('selected',active);team.setAttribute('aria-pressed',String(active));if(cn){let star=cn.querySelector('.team-star');if(active&&!star){star=document.createElement('span');star.className='team-star';star.setAttribute('aria-label','关注球队');star.textContent='★';cn.appendChild(star)}else if(!active&&star)star.remove()}}for(const star of document.querySelectorAll('#matches .star')){const active=favs.has(star.dataset.home)||favs.has(star.dataset.away);star.classList.toggle('on',active);star.textContent=active?'★':'☆'}renderFavoriteList();applyLiveOnlyFilter();if(!$('standingsView').classList.contains('hidden'))renderStandings();if(!$('qualificationView').classList.contains('hidden'))renderQualificationView();if(!$('resultsView').classList.contains('hidden'))renderFavoriteResults()}document.addEventListener('click',e=>{const remove=e.target.closest('[data-remove-fav]');if(remove){favs.delete(remove.dataset.removeFav);localStorage.setItem('unl-favs',JSON.stringify([...favs]));updateFavoriteHighlights();return}if(e.target.closest('#clearFavs')){favs.clear();localStorage.setItem('unl-favs','[]');updateFavoriteHighlights();return}const team=e.target.closest('[data-team]');if(team){const name=team.dataset.team;if(favs.has(name))favs.delete(name);else favs.add(name);localStorage.setItem('unl-favs',JSON.stringify([...favs]));updateFavoriteHighlights();return}const b=e.target.closest('.star');if(!b)return;const names=[b.dataset.home,b.dataset.away];if(names.every(name=>favs.has(name)))names.forEach(name=>favs.delete(name));else names.forEach(name=>favs.add(name));localStorage.setItem('unl-favs',JSON.stringify([...favs]));updateFavoriteHighlights()});
async function syncGoalInfo(){const now=Date.now(),targets=fixtures.filter(f=>scores[f.id]&&eventIds[f.id]).filter(f=>{const old=goals[f.id],ttl=scores[f.id].state==='in'?45000:86400000;return!old||old.version!==4||now-(old.checkedAt||0)>ttl});for(let i=0;i<targets.length;i+=4){await Promise.all(targets.slice(i,i+4).map(async f=>{try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/summary?event='+encodeURIComponent(eventIds[f.id]),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),comp=d.header?.competitions?.[0]||{},teams=comp.competitors||[],home=teams.find(x=>x.homeAway==='home')?.team||{},away=teams.find(x=>x.homeAway==='away')?.team||{},playRoot=d.plays||{},rawPlays=d.keyEvents||d.scoringPlays||d.scoringplays||d.boxscore?.scoringPlays||playRoot.scoringPlays||playRoot.scoringplays||playRoot.allPlays||playRoot.items||(Array.isArray(playRoot)?playRoot:[]),plays=Array.isArray(rawPlays)?rawPlays:rawPlays?.items||rawPlays?.plays||[],items=[],direct=d.goals||d.gameInfo?.goals||comp.goals||d.boxscore?.goals;if(direct){for(const side of ['home','away']){const bucket=direct[side],list=Array.isArray(bucket)?bucket:bucket?.goals||bucket?.items||[];for(const g of list){const scorer=g.name||g.displayName||g.athlete?.displayName||g.scorer?.displayName||'',clock=g.clock?.displayValue||g.clock||g.minute?.displayValue||g.minute||'',minute=typeof clock==='number'?clock+"'":String(clock);if(scorer)items.push({side,scorer,minute,note:g.ownGoal?'乌龙球':''})}}}if(!items.length)for(const p of plays){const type=String(p.type?.text||p.type?.name||p.text||'').toLowerCase();if(p.scoringPlay===false||(!p.scoringPlay&&!type.includes('goal')))continue;const scorer=p.scorer?.displayName||p.athlete?.displayName||p.participants?.find(x=>/scorer|goal/i.test(String(x.type?.text||x.type?.name||'')))?.athlete?.displayName||p.participants?.map(x=>x.athlete?.displayName||x.athlete?.fullName||x.displayName||x.fullName).find(Boolean)||p.athletes?.map(x=>x.athlete?.displayName||x.displayName).find(Boolean)||p.text?.replace(/^.*?goal!?\s*/i,'').split(/[,(]/)[0]?.trim()||'',teamId=String(p.team?.id||p.teamId||p.competitor?.team?.id||''),teamName=String(p.team?.displayName||p.team?.name||p.competitor?.team?.displayName||''),side=teamId&&teamId===String(home.id)?'home':teamId&&teamId===String(away.id)?'away':teamName.toLowerCase().includes(f.home.toLowerCase())?'home':teamName.toLowerCase().includes(f.away.toLowerCase())?'away':'',clock=p.clock?.displayValue||p.minute?.displayValue||p.minute||'',minute=typeof clock==='number'?clock+"'":String(clock).replace(/:00$/,"'");if(side)items.push({side,scorer,minute,note:/own goal/i.test(type)?'乌龙球':''})}if(!items.length){const groups=d.boxscore?.players||[];for(const group of groups){const t=group.team||{},side=String(t.id||'')===String(home.id)?'home':String(t.id||'')===String(away.id)?'away':t.displayName?.toLowerCase().includes(f.home.toLowerCase())?'home':t.displayName?.toLowerCase().includes(f.away.toLowerCase())?'away':'';for(const sg of group.statistics||[]){const keys=sg.keys||sg.labels||[],idx=keys.findIndex(k=>/^(g|goals?)$/i.test(String(k)));if(idx<0)continue;for(const row of sg.athletes||[]){const a=row.athlete||row,stats=row.stats||[],count=Number(Array.isArray(stats)?stats[idx]:stats.goals||stats.goal||0);if(side&&count>0)items.push({side,scorer:a.displayName||a.fullName||'球员',minute:'',note:count>1?count+' 球':''})}}}}goals[f.id]={items,checkedAt:Date.now(),state:scores[f.id].state,version:4}}catch(e){console.warn('Goal info fetch failed:',e)}}))}}
async function syncScores(backfill=true){
const status=$('syncStatus');status.textContent='正在同步比分和比赛场地…';
try{
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),today=parts.find(p=>p.type==='year').value+'-'+parts.find(p=>p.type==='month').value+'-'+parts.find(p=>p.type==='day').value;
const dates=backfill?[...new Set(fixtures.map(f=>f.date))]:[today];let events=[],failed=0;
for(let i=0;i<dates.length;i+=4){const batch=await Promise.all(dates.slice(i,i+4).map(async d=>{try{const url='https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations/scoreboard?dates='+d.replace(/-/g,'')+'&limit=100',response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return(await response.json()).events||[]}catch(e){failed++;return[]}}));events.push(...batch.flat())}
let changed=0,venueChanged=0;const normalize=name=>{let v=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();if(v==='turkiye')v='turkey';if(v==='czechia')v='czechrepublic';if(v==='republicofireland')v='ireland';return v.replace(/[^a-z0-9]/g,'')};
for(const event of events){const comp=event.competitions?.[0],competitors=comp?.competitors||[],home=competitors.find(c=>c.homeAway==='home'),away=competitors.find(c=>c.homeAway==='away');if(!home||!away)continue;const eventDate=String(event.date||'').slice(0,10),homeName=normalize(home.team?.displayName||home.team?.name),awayName=normalize(away.team?.displayName||away.team?.name),fixture=fixtures.find(f=>f.date===eventDate&&normalize(f.home)===homeName&&normalize(f.away)===awayName);if(!fixture)continue;if(event.id)eventIds[fixture.id]=String(event.id);
const venue=comp.venue||event.venue||{},address=venue.address||{},city=address.city||venue.city||'',country=address.country||venue.country||'',stadium=venue.fullName||venue.name||'';if(city||country||stadium){venues[fixture.id]={stadium,city,country};venueChanged++}
const status=comp.status||event.status||{},statusType=status.type||{},state=statusType.state;if(state!=='in'&&state!=='post')continue;const h=Number.parseInt(home.score,10),a=Number.parseInt(away.score,10);if(!Number.isInteger(h)||!Number.isInteger(a))continue;scores[fixture.id]={h,a,state,phase:[statusType.name,statusType.detail,statusType.shortDetail,status.displayClock,status.clock].filter(Boolean).join(' '),detail:statusType.detail||'',shortDetail:statusType.shortDetail||'',clock:status.displayClock||status.clock||'',period:status.period||comp.status?.period||event.status?.period||0,clockUpdatedAt:Date.now(),source:'espn',updatedAt:Date.now()};changed++}
localStorage.setItem('unl-scores',JSON.stringify(scores));localStorage.setItem('unl-venues',JSON.stringify(venues));localStorage.setItem('unl-event-ids',JSON.stringify(eventIds));await syncGoalInfo();localStorage.setItem('unl-goals',JSON.stringify(goals));render();if(!$('standingsView').classList.contains('hidden'))renderStandings();if(!$('qualificationView').classList.contains('hidden'))renderQualificationView();if(!$('resultsView').classList.contains('hidden'))renderFavoriteResults();status.textContent='已更新 '+changed+' 场比分、'+venueChanged+' 场比赛场地 · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+(failed?'（部分日期同步失败）':'')
}catch(error){status.textContent='自动同步暂不可用，可手动录入比分或稍后重试';console.warn('Nations League score sync failed:',error)}}
$('syncScores').onclick=()=>syncScores(true);
render();syncScores(true);setInterval(updateLiveDurations,1000);setInterval(()=>syncScores(false),180000);
